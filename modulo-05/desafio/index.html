<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frontend Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

   
</head>
<body>
  <div class="container py-4 py-lg-5">

    <!-- Toggle sol / lua -->
    <div class="d-flex justify-content-end align-items-center gap-2 theme-switch mb-4 mb-lg-5">
      <i class="bi bi-brightness-high" aria-hidden="true"></i>
      <div class="form-check form-switch m-0 p-0 d-flex">
        <input class="form-check-input m-0" type="checkbox" role="switch" id="themeSwitch" checked aria-label="Alternar tema escuro">
      </div>
      <i class="bi bi-moon" aria-hidden="true"></i>
    </div>

    <div class="row align-items-center g-5 pt-lg-4">
      <!-- Título -->
      <div class="col-lg-6">
        <h1 class="m-0">
          <span class="welcome-light d-block">Welcome to the</span>
          <span class="welcome-bold d-block">Frontend Quiz!</span>
        </h1>
        <p class="hint mt-4 mb-0">Pick a subject to get started.</p>
      </div>

      <!-- Assuntos -->
      <div class="col-lg-6">
        <div class="d-grid gap-3">
          <button type="button" class="btn subject-btn d-flex align-items-center gap-3 text-start">
            <span class="icon-box icon-html"><i class="bi bi-code-slash"></i></span> HTML
          </button>
          <button type="button" class="btn subject-btn d-flex align-items-center gap-3 text-start">
            <span class="icon-box icon-css"><i class="bi bi-brush"></i></span> CSS
          </button>
          <button type="button" class="btn subject-btn d-flex align-items-center gap-3 text-start">
            <span class="icon-box icon-js">JS</span> Javascript
          </button>
          <button type="button" class="btn subject-btn d-flex align-items-center gap-3 text-start">
            <span class="icon-box icon-a11y"><i class="bi bi-universal-access"></i></span> Accessibility
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Alterna entre tema escuro e claro
    const sw = document.getElementById('themeSwitch');
    sw.addEventListener('change', () => {
      const dark = sw.checked;
      document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
      document.body.style.backgroundColor = dark ? '#313e51' : '#f4f6fa';
      document.body.style.color = dark ? '#fff' : '#313e51';
      document.querySelectorAll('.subject-btn').forEach(b => {
        b.style.backgroundColor = dark ? '#3b4d66' : '#fff';
        b.style.color = dark ? '#fff' : '#313e51';
      });
    });
  </script>
</body>
</html>
